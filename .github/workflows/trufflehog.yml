name: TruffleHog

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th, full history
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    uses: SaubhagyaDeep/Checkov-testing-2/.github/workflows/trufflehog.yml@4736e877d79e6fbe0a2fe38e97cd0148964d0633
    with:
      scan: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      mode: report   # set to block to fail PRs on verified secrets
    secrets: inherit
