name: TruffleHog

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th, full history
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    uses: SaubhagyaDeep/Checkov-testing/.github/workflows/trufflehog.yml@959f1976e210d4a3baca692b18040d018c74a791
    with:
      scan: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      mode: report   # set to block to fail PRs on verified secrets
    secrets: inherit
