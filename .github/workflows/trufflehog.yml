name: TruffleHog

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th, full history
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    uses: SaubhagyaDeep/Checkov-testing/.github/workflows/trufflehog.yml@8493fb124fa9642b6a5b6b0b85ce76361cc1a42e # test: latest-pins branch
    with:
      scan: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      results: verified,unverified   # per-repo toggle; use `verified` for low noise
      mode: block                   # report (never fails) | block (fails on ANY finding)
      show-secret: redacted          # none (default) | redacted: adds a partial-value Hint column
    secrets: inherit
