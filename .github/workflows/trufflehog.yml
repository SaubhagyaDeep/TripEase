name: TruffleHog

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th, full history
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    uses: SaubhagyaDeep/Checkov-testing/.github/workflows/trufflehog.yml@a1abee7a72a955888bc36cb0efdeffbcff64a024 # v1.0.3
    with:
      scan: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      results: verified,unverified   # per-repo toggle; use `verified` for low noise
      mode: report                   # report (never fails) | block (fails on ANY finding)
    secrets: inherit
